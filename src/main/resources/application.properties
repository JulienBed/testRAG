# =============================================================================
# APPLICATION
# =============================================================================
quarkus.application.name=llm-rag-pdf-summary

# =============================================================================
# ANTHROPIC (CLAUDE) - Configuration du LLM
# =============================================================================
# Définissez votre clé API Anthropic via la variable d'environnement :
#   export ANTHROPIC_API_KEY=sk-ant-...
# Ou directement ici pour le développement (ne pas committer une vraie clé !)
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:changeme}

# Modèle de chat Claude utilisé pour la génération du résumé.
# Options disponibles (du plus rapide au plus puissant) :
#   claude-haiku-4-5-20251001   → très rapide, économique
#   claude-sonnet-4-5-20250929  → équilibre qualité/vitesse (recommandé)
#   claude-opus-4-6             → le plus puissant
quarkus.langchain4j.anthropic.chat-model.model-name=claude-haiku-4-5-20251001
quarkus.langchain4j.anthropic.chat-model.temperature=0.3
quarkus.langchain4j.anthropic.chat-model.max-tokens=2048

# Timeout pour les appels API Claude
quarkus.langchain4j.anthropic.timeout=60s

# Logs des requêtes/réponses (utile pour comprendre ce qui se passe en dev)
quarkus.langchain4j.anthropic.log-requests=true
quarkus.langchain4j.anthropic.log-responses=true

# =============================================================================
# EMBEDDING MODEL LOCAL - all-MiniLM-L6-v2 (quantized)
# =============================================================================
# Aucune configuration API requise ! Le modèle est embarqué dans le JAR.
#
# Pourquoi un modèle local plutôt qu'OpenAI text-embedding-ada-002 ?
#   - L'API Anthropic ne fournit PAS de service d'embedding
#   - all-MiniLM-L6-v2 est open-source, gratuit, tourne sur CPU
#   - Latence nulle (pas de réseau), dimensions 384
#   - Excellente qualité pour la recherche sémantique multilingue
#
# Le bean EmbeddingModel est produit dans RagConfiguration.java
# via AllMiniLmL6V2QuantizedEmbeddingModel (inclus dans langchain4j-embeddings-all-minilm-l6-v2-q)

# =============================================================================
# RAG - Paramètres de récupération
# =============================================================================
# Nombre de chunks (segments) retournés lors de la recherche sémantique
quarkus.langchain4j.easy-rag.max-results=5
# Score minimum de similarité cosinus (0.0 à 1.0)
quarkus.langchain4j.easy-rag.min-score=0.5

# =============================================================================
# REST
# =============================================================================
quarkus.http.port=8080
# Taille max d'upload (pour les gros PDFs)
quarkus.http.limits.max-body-size=50M

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO
quarkus.log.category."org.acme.rag".level=DEBUG
quarkus.log.category."org.apache.pdfbox".level=WARN
quarkus.log.category."ai.djl".level=WARN

# =============================================================================
# DEV MODE
# =============================================================================
%dev.quarkus.langchain4j.anthropic.log-requests=true
%dev.quarkus.langchain4j.anthropic.log-responses=true

# =============================================================================
# TEST - Mock du LLM pour les tests unitaires
# =============================================================================
%test.quarkus.langchain4j.anthropic.api-key=test-key
%test.quarkus.langchain4j.mock-chat-model.enabled=true
