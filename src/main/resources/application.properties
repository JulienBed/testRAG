# =============================================================================
# APPLICATION
# =============================================================================
quarkus.application.name=llm-rag-pdf-summary

# =============================================================================
# OPENAI - Configuration du LLM
# =============================================================================
# Remplacez par votre clé API OpenAI
# En production : utiliser une variable d'environnement QUARKUS_LANGCHAIN4J_OPENAI_API_KEY
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:changeme}

# Modèle de chat (génération de texte / résumé)
# GPT-4o offre le meilleur équilibre qualité/prix pour le RAG
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.3
quarkus.langchain4j.openai.chat-model.max-tokens=2048

# Modèle d'embedding (vectorisation du texte)
# text-embedding-ada-002 : standard, 1536 dimensions
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-ada-002

# Timeout pour les appels API
quarkus.langchain4j.openai.timeout=60s

# Logs des appels LLM (utile pour comprendre ce qui se passe)
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true

# =============================================================================
# VECTOR STORE en mémoire
# =============================================================================
# Le store in-process est réinitialisé à chaque redémarrage.
# Pour persister les données, utilisez PgVector ou Chroma.
quarkus.langchain4j.in-process-embedding.enabled=true

# =============================================================================
# RAG - Paramètres de récupération
# =============================================================================
# Nombre de chunks (segments) retournés lors de la recherche sémantique
quarkus.langchain4j.easy-rag.max-results=5
# Score minimum de similarité cosinus (0.0 à 1.0)
quarkus.langchain4j.easy-rag.min-score=0.6

# =============================================================================
# REST
# =============================================================================
quarkus.http.port=8080
# Taille max d'upload (pour les gros PDFs)
quarkus.http.limits.max-body-size=50M

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO
quarkus.log.category."org.acme.rag".level=DEBUG
# Réduire le bruit des bibliothèques tierces
quarkus.log.category."org.apache.pdfbox".level=WARN

# =============================================================================
# DEV MODE
# =============================================================================
%dev.quarkus.langchain4j.openai.log-requests=true
%dev.quarkus.langchain4j.openai.log-responses=true

# =============================================================================
# TEST - Mock du LLM pour les tests unitaires
# =============================================================================
%test.quarkus.langchain4j.openai.api-key=test-key
%test.quarkus.langchain4j.mock-chat-model.enabled=true
