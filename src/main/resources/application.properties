# =============================================================================
# APPLICATION
# =============================================================================
quarkus.application.name=llm-rag-pdf-summary

# =============================================================================
# OLLAMA - Configuration du LLM local
# =============================================================================
# Ollama est un serveur qui tourne localement sur votre machine.
# Aucune clé API requise !
#
# Prérequis :
#   1. Installer Ollama : https://ollama.com
#   2. Télécharger un modèle : ollama pull mistral
#   3. Ollama démarre automatiquement en arrière-plan
#
# URL par défaut du serveur Ollama (localhost:11434)
quarkus.langchain4j.ollama.base-url=http://localhost:11434

# Modèle à utiliser pour la génération du résumé.
# Téléchargez le modèle avec : ollama pull <nom>
# Options recommandées :
#   mistral          → bon équilibre qualité/vitesse, ~4 Go RAM
#   llama3           → performant, ~5 Go RAM
#   gemma2           → Google, très bon en multilangue, ~5 Go RAM
#   phi3             → léger et rapide, ~2 Go RAM
#   llama3:8b        → version 8B paramètres de Llama3
quarkus.langchain4j.ollama.chat-model.model-id=mistral

quarkus.langchain4j.ollama.chat-model.temperature=0.3
quarkus.langchain4j.ollama.chat-model.num-predict=2048

# Timeout pour les appels Ollama (les modèles locaux peuvent être lents au premier appel)
quarkus.langchain4j.ollama.timeout=120s

# Logs des requêtes/réponses (utile pour comprendre ce qui se passe en dev)
quarkus.langchain4j.ollama.log-requests=true
quarkus.langchain4j.ollama.log-responses=true

# =============================================================================
# EMBEDDING MODEL LOCAL - all-MiniLM-L6-v2 (quantized)
# =============================================================================
# Aucune configuration API requise ! Le modèle est embarqué dans le JAR.
#
# Pourquoi un modèle local plutôt qu'un service d'embedding externe ?
#   - all-MiniLM-L6-v2 est open-source, gratuit, tourne sur CPU
#   - Latence nulle (pas de réseau), dimensions 384
#   - Excellente qualité pour la recherche sémantique multilingue
#
# Le bean EmbeddingModel est produit dans RagConfiguration.java
# via AllMiniLmL6V2QuantizedEmbeddingModel (inclus dans langchain4j-embeddings-all-minilm-l6-v2-q)

# =============================================================================
# RAG - Paramètres de récupération
# =============================================================================
# Nombre de chunks (segments) retournés lors de la recherche sémantique
quarkus.langchain4j.easy-rag.max-results=5
# Score minimum de similarité cosinus (0.0 à 1.0)
quarkus.langchain4j.easy-rag.min-score=0.5

# =============================================================================
# REST
# =============================================================================
quarkus.http.port=8080
# Taille max d'upload (pour les gros PDFs)
quarkus.http.limits.max-body-size=50M

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO
quarkus.log.category."org.acme.rag".level=DEBUG
quarkus.log.category."org.apache.pdfbox".level=WARN
quarkus.log.category."ai.djl".level=WARN

# =============================================================================
# DEV MODE
# =============================================================================
%dev.quarkus.langchain4j.ollama.log-requests=true
%dev.quarkus.langchain4j.ollama.log-responses=true

# =============================================================================
# TEST - Mock du LLM pour les tests unitaires
# =============================================================================
%test.quarkus.langchain4j.mock-chat-model.enabled=true
